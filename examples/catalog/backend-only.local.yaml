apiVersion: portal.atlas.dev/v1alpha1
kind: PortalService
metadata: { name: notifier }
spec:
  service: { id: notifier, displayName: Notification Relay, owner: platform, version: 1.0.0, enabled: true }
  backend: { apiBasePath: /api/services/notifier, upstream: http://localhost:4299, apiVersion: 1.0.0, requiredPermissions: [portal:admin] }
  health: { url: http://localhost:4299/health/ready, intervalSeconds: 30, timeoutMilliseconds: 1000 }
  security: { allowedOrigins: [], integrityRequired: true }
  extensions: []

