replicaCount: 2
image: { repository: ghcr.io/gheroco/frontend_template/audit, tag: "1.0.0", digest: "", pullPolicy: IfNotPresent }
imagePullSecrets: []
service: { port: 4202 }
serviceAccount: { create: true, name: "" }
resources:
  requests: { cpu: 75m, memory: 96Mi }
  limits: { cpu: 400m, memory: 256Mi }
autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 8, targetCPUUtilizationPercentage: 70, targetMemoryUtilizationPercentage: 80 }
pdb: { enabled: true, minAvailable: 1 }
auth: { mode: oidc, issuer: https://identity.example.com, audience: portal-api, permissionsClaim: permissions, rolesClaim: roles }
secret: { existingName: atlas-platform-secrets, devJwtSecretKey: DEV_JWT_SECRET }
observability: { otelEndpoint: http://otel-collector.observability.svc.cluster.local:4318, environment: production }
portalRegistration:
  create: true
  enabled: true
  owner: security-platform
  serviceVersion: "1.0.0"
  extensionVersion: "1.0.0"
  integrity: sha384-Mfsk6seQDfL8ecM7Itfqodtid+NPwkmtDigkosQzX81awizMfDGRxZIfQMRG6fSF
gateway: { enabled: true, name: atlas-gateway, sectionName: http, pathPrefix: /extensions/audit }
networkPolicy: { enabled: true, gatewayNamespace: gateway-system }
topologySpread: { enabled: true }

