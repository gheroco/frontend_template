{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: audit-microfrontend
  labels:
    {{- include "audit.labels" . | nindent 4 }}
spec:
  parentRefs: [{ name: {{ .Values.gateway.name }}, sectionName: {{ .Values.gateway.sectionName }} }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: {{ .Values.gateway.pathPrefix }} } }]
      filters:
        - type: URLRewrite
          urlRewrite: { path: { type: ReplacePrefixMatch, replacePrefixMatch: / } }
      backendRefs: [{ name: audit, port: {{ .Values.service.port }}, weight: 1 }]
{{- end }}

