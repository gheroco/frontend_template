replicaCount: 2
image: { repository: ghcr.io/gheroco/frontend_template/github-webhooks, tag: "1.0.0", digest: "", pullPolicy: IfNotPresent }
imagePullSecrets: []
service: { port: 4203 }
serviceAccount: { create: true, name: "" }
receiver:
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 750m, memory: 384Mi }
  autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 12, targetCPUUtilizationPercentage: 65 }
  pdb: { enabled: true, maxUnavailable: 1 }
worker:
  replicas: 1
  prefetch: 8
  databasePoolSize: 4
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 512Mi }
keda:
  enabled: true
  minReplicaCount: 1
  maxReplicaCount: 8
  queueLength: 25
  activationQueueLength: 1
  pollingInterval: 10
  cooldownPeriod: 180
  fallback: { failureThreshold: 3, replicas: 2 }
queue: { name: github.webhooks.raw }
payload: { maxBytes: 26214400 }
retentionDays: 90
auth:
  mode: oidc
  issuer: https://identity.example.com
  audience: portal-api
  permissionsClaim: permissions
  rolesClaim: roles
secret:
  existingName: atlas-github-webhooks
  databaseUrlKey: DATABASE_URL
  amqpUrlKey: AMQP_URL
  webhookSecretKey: GITHUB_WEBHOOK_SECRET
  previousWebhookSecretKey: GITHUB_WEBHOOK_PREVIOUS_SECRET
  recoveryTokenKey: GITHUB_RECOVERY_TOKEN
  devJwtSecretKey: DEV_JWT_SECRET
observability: { otelEndpoint: http://otel-collector.observability.svc.cluster.local:4318, environment: production }
migration: { enabled: true, backoffLimit: 4 }
recovery:
  enabled: false
  schedule: "*/15 * * * *"
  apiUrl: https://api.github.com
  apiVersion: "2026-03-10"
  lookbackHours: 48
  minimumIntervalSeconds: 3600
  targets: []
portalRegistration:
  create: true
  enabled: true
  owner: developer-platform
  serviceVersion: "1.0.0"
  extensionVersion: "1.0.0"
  elementName: github-webhook-deliveries-v1
  integrity: sha384-K7GmnXl0HPEeYhXpLEK+jivI1YDixcXDDWfpk6F8WQPbYGe1BI730zTdNtXsve9R
gateway:
  enabled: true
  name: atlas-gateway
  sectionName: https
  webhookPath: /webhooks/github
  extensionPath: /extensions/github-webhooks
networkPolicy:
  enabled: true
  gatewayNamespace: envoy-gateway-system
  databaseNamespace: data
  brokerNamespace: messaging
  observabilityNamespace: observability
topologySpread: { enabled: true }
