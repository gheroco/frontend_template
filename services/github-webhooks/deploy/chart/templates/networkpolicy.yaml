{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: github-webhooks }
spec:
  podSelector:
    matchLabels:
      {{- include "github-webhooks.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - { podSelector: { matchLabels: { app.kubernetes.io/name: portal-shell } } }
        - { namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }} } } }
      ports: [{ protocol: TCP, port: {{ .Values.service.port }} }]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.databaseNamespace }} } } }]
      ports: [{ protocol: TCP, port: 5432 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.brokerNamespace }} } } }]
      ports: [{ protocol: TCP, port: 5672 }, { protocol: TCP, port: 5671 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.observabilityNamespace }} } } }]
      ports: [{ protocol: TCP, port: 4318 }]
    {{- if .Values.recovery.enabled }}
    - ports: [{ protocol: TCP, port: 443 }]
    {{- end }}
{{- end }}
