name: Portal shell
on:
  pull_request:
    paths: ["apps/portal-shell/**", "packages/**", "deploy/charts/portal-shell/**", "package-lock.json", ".github/workflows/_component.yml", ".github/workflows/portal-shell.yml"]
  workflow_dispatch:
jobs:
  ci:
    uses: ./.github/workflows/_component.yml
    with: { workspace: "@atlas/portal-shell", dockerfile: apps/portal-shell/Dockerfile, image: atlas-portal-shell, chart: deploy/charts/portal-shell }

