name: Yerevan Atlas

on:
  pull_request:
    paths:
      - apps/yerevan-atlas/**
      - .github/workflows/yerevan-atlas.yml
  push:
    branches:
      - apps/yerevan-atlas
      - agent/yerevan-atlas-*
    paths:
      - apps/yerevan-atlas/**
      - .github/workflows/yerevan-atlas.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/yerevan-atlas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: apps/yerevan-atlas/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --workspaces=false
      - run: npm run check --workspaces=false
      - run: python -m unittest discover -s tests -p '*_test.py'
      - run: npm run build --workspaces=false
      - uses: actions/upload-artifact@v4
        with:
          name: yerevan-atlas-dist
          path: apps/yerevan-atlas/dist
          retention-days: 7
