name: GitHub webhooks service
on:
  pull_request:
    paths: ["services/github-webhooks/**", "packages/**", "package-lock.json", ".github/workflows/_component.yml", ".github/workflows/github-webhooks.yml"]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  ci:
    uses: ./.github/workflows/_component.yml
    with: { workspace: "@atlas/github-webhooks-service", dockerfile: services/github-webhooks/Dockerfile, image: atlas-github-webhooks, chart: services/github-webhooks/deploy/chart }
