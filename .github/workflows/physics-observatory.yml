name: Physics Observatory
on:
  push:
    branches: [agent/physics-observatory-2100, apps/evolution-physics-reader]
    paths: [apps/evolution-physics-reader/**, .github/workflows/physics-observatory.yml]
permissions:
  contents: read
concurrency:
  group: physics-observatory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/evolution-physics-reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci --workspaces=false
      - run: pip install pillow==11.3.0 playwright==1.56.0
      - run: python -m playwright install --with-deps chromium webkit
      - run: python scripts/content/audit_observatory.py
      - run: npm run check && npm test && npm run build
      - run: python scripts/test_observatory.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: physics-observatory-review
          path: apps/evolution-physics-reader/artifacts
          retention-days: 30
