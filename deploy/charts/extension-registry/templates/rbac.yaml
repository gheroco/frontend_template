{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "extension-registry.serviceAccountName" . }}
  labels:
    {{- include "extension-registry.labels" . | nindent 4 }}
automountServiceAccountToken: true
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: extension-registry-reader
rules:
  - apiGroups: [portal.atlas.dev]
    resources: [portalservices]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: extension-registry-reader
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: extension-registry-reader }
subjects:
  - { kind: ServiceAccount, name: {{ include "extension-registry.serviceAccountName" . }}, namespace: {{ .Release.Namespace }} }

