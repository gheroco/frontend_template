apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: portalservices.portal.atlas.dev
spec:
  group: portal.atlas.dev
  scope: Namespaced
  names:
    plural: portalservices
    singular: portalservice
    kind: PortalService
    shortNames: [psvc]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [service, backend, health, security, extensions]
              properties:
                service:
                  type: object
                  required: [id, displayName, owner, version, enabled]
                  properties:
                    id: { type: string, pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$", maxLength: 63 }
                    displayName: { type: string, minLength: 1, maxLength: 80 }
                    owner: { type: string, minLength: 1, maxLength: 120 }
                    version: { type: string, pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+([-+].*)?$" }
                    enabled: { type: boolean }
                backend:
                  type: object
                  required: [apiBasePath, upstream, apiVersion, requiredPermissions]
                  properties:
                    apiBasePath: { type: string, pattern: "^/api/services/[a-z][a-z0-9-]*$" }
                    upstream: { type: string, pattern: "^https?://" }
                    apiVersion: { type: string }
                    requiredPermissions: { type: array, maxItems: 32, items: { type: string, pattern: "^[a-z][a-z0-9-]*:[a-z][a-z0-9-]*$" } }
                health:
                  type: object
                  required: [url, intervalSeconds, timeoutMilliseconds]
                  properties:
                    url: { type: string, pattern: "^https?://" }
                    intervalSeconds: { type: integer, minimum: 5, maximum: 300 }
                    timeoutMilliseconds: { type: integer, minimum: 100, maximum: 10000 }
                security:
                  type: object
                  required: [allowedOrigins, integrityRequired]
                  properties:
                    allowedOrigins: { type: array, maxItems: 16, items: { type: string } }
                    integrityRequired: { type: boolean, enum: [true] }
                extensions:
                  type: array
                  maxItems: 16
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [id]
                  items:
                    type: object
                    required: [id, displayName, description, icon, route, order, elementName, entry, extensionVersion, apiVersion, portalCompatibility, requiredPermissions, featureFlags]
                    properties:
                      id: { type: string, pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)*$" }
                      displayName: { type: string, minLength: 1, maxLength: 48 }
                      description: { type: string, maxLength: 180 }
                      icon: { type: string, enum: [boxes, clipboard, pulse, shield, database, settings, sparkles] }
                      route: { type: string, pattern: "^/[a-z0-9]+([/-][a-z0-9]+)*$" }
                      order: { type: integer, minimum: 0, maximum: 10000 }
                      elementName: { type: string, pattern: "^[a-z][a-z0-9]*(-[a-z0-9]+)+$" }
                      entry:
                        type: object
                        required: [url, type, integrity, crossOrigin]
                        properties:
                          url: { type: string }
                          type: { type: string, enum: [module] }
                          integrity: { type: string, pattern: "^sha384-[A-Za-z0-9+/]{64}$" }
                          crossOrigin: { type: string, enum: [anonymous] }
                      extensionVersion: { type: string }
                      apiVersion: { type: string }
                      portalCompatibility: { type: string }
                      requiredPermissions: { type: array, maxItems: 32, items: { type: string } }
                      featureFlags: { type: object, additionalProperties: { type: boolean } }
