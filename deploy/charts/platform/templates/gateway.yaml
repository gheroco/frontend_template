apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  labels:
    app.kubernetes.io/name: atlas-gateway
    app.kubernetes.io/part-of: atlas-platform
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    {{- if .Values.gateway.http.enabled }}
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.http.port }}
      allowedRoutes:
        namespaces: { from: Same }
    {{- end }}
    {{- if .Values.gateway.tls.enabled }}
    - name: https
      hostname: {{ .Values.gateway.tls.hostname | quote }}
      protocol: HTTPS
      port: {{ .Values.gateway.tls.port }}
      tls:
        mode: Terminate
        certificateRefs: [{ kind: Secret, name: {{ .Values.gateway.tls.existingSecret }} }]
      allowedRoutes:
        namespaces: { from: Same }
    {{- end }}

