replicaCount: 2
image:
  repository: ghcr.io/gheroco/frontend_template/portal-shell
  tag: "1.0.0"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
serviceAccount:
  create: true
  name: ""
podAnnotations: {}
service:
  port: 4000
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 500m, memory: 384Mi }
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
pdb:
  enabled: true
  minAvailable: 1
gateway:
  enabled: true
  name: atlas-gateway
  sectionName: http
config:
  authMode: oidc
  cookieSecure: "true"
  publicUrl: https://portal.example.com
  registryUrl: http://extension-registry:4100
  microfrontendOrigins: ""
  oidcIssuer: https://identity.example.com
  oidcClientId: atlas-portal
  oidcAudience: portal-api
  serviceUpstreamSuffixes: .svc.cluster.local
  otelEndpoint: http://otel-collector.observability.svc.cluster.local:4318
  deploymentEnvironment: production
secret:
  existingName: atlas-platform-secrets
  sessionKeyKey: SESSION_KEY
  oidcClientSecretKey: OIDC_CLIENT_SECRET
  devJwtSecretKey: DEV_JWT_SECRET
  registryApiTokenKey: REGISTRY_API_TOKEN
networkPolicy:
  enabled: true
  gatewayNamespace: gateway-system
topologySpread:
  enabled: true

