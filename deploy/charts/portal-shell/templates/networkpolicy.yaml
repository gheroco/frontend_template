{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "portal-shell.fullname" . }}
spec:
  podSelector:
    matchLabels:
      {{- include "portal-shell.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.gatewayNamespace }} } }
        - podSelector: { matchLabels: { app.kubernetes.io/part-of: atlas-platform } }
      ports: [{ protocol: TCP, port: {{ .Values.service.port }} }]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector: { matchLabels: { app.kubernetes.io/part-of: atlas-platform } }
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: [{ ipBlock: { cidr: 0.0.0.0/0 } }]
      ports: [{ protocol: TCP, port: 443 }]
{{- end }}

