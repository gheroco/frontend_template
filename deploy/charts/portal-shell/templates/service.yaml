apiVersion: v1
kind: Service
metadata:
  name: {{ include "portal-shell.fullname" . }}
  labels:
    {{- include "portal-shell.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "portal-shell.selectorLabels" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }

