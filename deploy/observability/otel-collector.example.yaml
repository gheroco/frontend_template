apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-atlas
  namespace: observability
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      memory_limiter: { check_interval: 1s, limit_mib: 384 }
      batch: { timeout: 5s, send_batch_size: 1024 }
      attributes/redact:
        actions:
          - { key: http.request.header.authorization, action: delete }
          - { key: http.request.header.cookie, action: delete }
    exporters:
      otlp:
        endpoint: ${env:TRACING_BACKEND_ENDPOINT}
        tls: { insecure: false }
    service:
      telemetry:
        logs: { level: info }
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, attributes/redact, batch]
          exporters: [otlp]

