replicaCount: 1
image: { repository: atlas/portal-shell, tag: "1.0.0", pullPolicy: IfNotPresent }
autoscaling: { enabled: false }
pdb: { enabled: false }
gateway: { enabled: true, name: atlas-gateway, sectionName: http }
config:
  authMode: dev
  cookieSecure: "false"
  publicUrl: http://localhost:8080
  registryUrl: http://extension-registry:4100
  microfrontendOrigins: ""
  oidcIssuer: https://identity.example.com
  oidcClientId: atlas-portal
  oidcAudience: portal-api
  serviceUpstreamSuffixes: .svc.cluster.local
  otelEndpoint: ""
  deploymentEnvironment: development
networkPolicy: { enabled: true, gatewayNamespace: envoy-gateway-system }
