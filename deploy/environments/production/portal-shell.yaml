replicaCount: 3
autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 12, targetCPUUtilizationPercentage: 65, targetMemoryUtilizationPercentage: 75 }
config:
  authMode: oidc
  cookieSecure: "true"
  publicUrl: https://portal.example.com
  registryUrl: http://extension-registry:4100
  microfrontendOrigins: ""
  oidcIssuer: https://identity.example.com
  oidcClientId: atlas-portal
  oidcAudience: portal-api
  serviceUpstreamSuffixes: .svc.cluster.local
  otelEndpoint: http://otel-collector.observability.svc.cluster.local:4318
  deploymentEnvironment: production
gateway: { enabled: true, name: atlas-gateway, sectionName: https }
networkPolicy: { enabled: true, gatewayNamespace: envoy-gateway-system }

