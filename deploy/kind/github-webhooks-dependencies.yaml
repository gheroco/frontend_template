apiVersion: v1
kind: ConfigMap
metadata: { name: github-webhooks-rabbitmq, namespace: atlas-platform }
data:
  rabbitmq.conf: |
    listeners.tcp.default = 5672
    max_message_size = 33554432
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: github-webhooks-postgres, namespace: atlas-platform }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: github-webhooks-postgres } }
  template:
    metadata: { labels: { app.kubernetes.io/name: github-webhooks-postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:17.6-alpine3.22
          env:
            - { name: POSTGRES_DB, value: atlas }
            - { name: POSTGRES_USER, value: atlas }
            - { name: POSTGRES_PASSWORD, value: atlas-dev-only }
          ports: [{ name: postgres, containerPort: 5432 }]
          readinessProbe: { exec: { command: [pg_isready, -U, atlas, -d, atlas] }, initialDelaySeconds: 3, periodSeconds: 3 }
          livenessProbe: { exec: { command: [pg_isready, -U, atlas, -d, atlas] }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, emptyDir: { sizeLimit: 1Gi } }]
---
apiVersion: v1
kind: Service
metadata: { name: github-webhooks-postgres, namespace: atlas-platform }
spec:
  selector: { app.kubernetes.io/name: github-webhooks-postgres }
  ports: [{ name: postgres, port: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: github-webhooks-rabbitmq, namespace: atlas-platform }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: github-webhooks-rabbitmq } }
  template:
    metadata: { labels: { app.kubernetes.io/name: github-webhooks-rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.1.4-alpine
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: atlas }
            - { name: RABBITMQ_DEFAULT_PASS, value: atlas-dev-only }
          ports: [{ name: amqp, containerPort: 5672 }]
          readinessProbe: { exec: { command: [rabbitmq-diagnostics, -q, ping] }, initialDelaySeconds: 10, periodSeconds: 5 }
          livenessProbe: { exec: { command: [rabbitmq-diagnostics, -q, ping] }, initialDelaySeconds: 30, periodSeconds: 15 }
          resources: { requests: { cpu: 75m, memory: 256Mi }, limits: { cpu: "1", memory: 768Mi } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
            - { name: config, mountPath: /etc/rabbitmq/rabbitmq.conf, subPath: rabbitmq.conf, readOnly: true }
      volumes:
        - { name: data, emptyDir: { sizeLimit: 1Gi } }
        - { name: config, configMap: { name: github-webhooks-rabbitmq } }
---
apiVersion: v1
kind: Service
metadata: { name: github-webhooks-rabbitmq, namespace: atlas-platform }
spec:
  selector: { app.kubernetes.io/name: github-webhooks-rabbitmq }
  ports: [{ name: amqp, port: 5672 }]
