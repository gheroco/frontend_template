apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: atlas-foundation
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  project: atlas
  source:
    repoURL: https://github.com/gheroco/frontend_template.git
    targetRevision: main
    path: deploy/charts/platform
    helm: { valueFiles: [../../environments/production/platform.yaml] }
  destination: { server: https://kubernetes.default.svc, namespace: atlas-platform }
  syncPolicy: { automated: { prune: true, selfHeal: true }, syncOptions: [CreateNamespace=true] }
---
