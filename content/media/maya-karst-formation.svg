  <g id="text_4">
   <text style="font-weight: 700; font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #167d8d" x="51.84" y="38.304" transform="rotate(-0 51.84 38.304)">03 / GEOLOGY</text>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 28px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173e43" x="51.84" y="73.872" transform="rotate(-0 51.84 73.872)">From a tropical seabed to limestone cliffs</text>
  </g>
  <g id="text_6">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #547477" x="51.84" y="100.1376" transform="rotate(-0 51.84 100.1376)">A simplified process diagram • not an exact cross-section or reconstruction of Maya Bay</text>
  </g>
  <g id="text_7">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173e43" x="51.84" y="396.72" transform="rotate(-0 51.84 396.72)">1  Carbonate builds up</text>
  </g>
  <g id="text_8">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #547477" transform="translate(51.84 422.254125)">Shells, skeletons and carbonate</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #547477" transform="translate(51.84 438.426937)">sediment accumulate in an</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #547477" transform="translate(51.84 454.59975)">ancient shallow sea.</text>
  </g>
  <g id="text_9">
   <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #dd633c" x="297.216" y="257.184" transform="rotate(-0 297.216 257.184)">→</text>
  </g>
  <g id="text_10">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173e43" x="322.56" y="396.72" transform="rotate(-0 322.56 396.72)">2  Rock rises &amp; fractures</text>
  </g>
  <g id="text_11">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #547477" transform="translate(322.56 422.254125)">Burial turns sediment to rock.</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #547477" transform="translate(322.56 438.426937)">Tectonic movement raises</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #547477" transform="translate(322.56 454.59975)">and fractures the limestone.</text>
  </g>
  <g id="text_12">
   <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #dd633c" x="567.936" y="257.184" transform="rotate(-0 567.936 257.184)">→</text>
  </g>
  <g id="text_13">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173e43" x="593.28" y="396.72" transform="rotate(-0 593.28 396.72)">3  Water opens pathways</text>
  </g>
  <g id="text_14">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #547477" transform="translate(593.28 422.254125)">Rainwater absorbs CO₂.</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #547477" transform="translate(593.28 438.426937)">Weakly acidic water dissolves</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #547477" transform="translate(593.28 454.59975)">limestone along cracks.</text>
  </g>
  <g id="text_15">
   <text style="font-size: 25px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #dd633c" x="838.656" y="257.184" transform="rotate(-0 838.656 257.184)">→</text>
  </g>
  <g id="text_16">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173e43" x="864" y="396.72" transform="rotate(-0 864 396.72)">4  Coastal karst remains</text>
  </g>
  <g id="text_17">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #547477" transform="translate(864 422.254125)">Dissolution and erosion shape</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #547477" transform="translate(864 438.426937)">steep relief; coastal processes</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #547477" transform="translate(864 454.59975)">and sea level shape the shore.</text>
  </g>
  <g id="text_18">
   <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #173e43" x="51.84" y="506.16" transform="rotate(-0 51.84 506.16)">Rock age ≠ bay age. Phi Phi limestone is ancient; the visible cliffs, beach and shoreline have a changing history.</text>
  </g>
  <g id="text_19">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #547477" x="51.84" y="529.6896" transform="rotate(-0 51.84 529.6896)">Original educational diagram • Geological process: USGS; local Permian carbonate context: IPA, 2024 • Time compressed; not to scale.</text>
  </g>
 </g>
