<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1210" viewBox="0 0 1400 1210" role="img" aria-labelledby="title desc"><title id="title">Four stages explaining Phang Nga Bay limestone and karst</title><desc id="desc">Four schematic panels show marine sediment accumulation and limestone formation; uplift, folding and fracturing; rainwater dissolution and karst; and changing sea levels plus marine erosion around remaining towers. Processes overlap and the present stack is not dated by the age of its limestone.</desc><rect x="0" y="0" width="1400" height="1210" rx="0" fill="#F6F4EC" /><text x="60" y="60" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#567177" text-anchor="start" >STORY ATLAS  /  DEEP TIME</text><text x="60" y="110" font-family="DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="700" fill="#173B42" text-anchor="start" >How an ancient seabed became a landscape</text><text x="60" y="153" font-family="DejaVu Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#567177" text-anchor="start" >A simplified explanation of Phang Nga Bay limestone and karst</text><rect x="60" y="193" width="620" height="410" rx="22" fill="#FFFFFF" stroke="#DCDDD2" stroke-width="2"/><circle cx="99" cy="232" r="21" fill="#D69538" /><text x="99" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle" >1</text><text x="136" y="241" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#173B42" text-anchor="start" >Marine sediments</text><rect x="720" y="193" width="620" height="410" rx="22" fill="#FFFFFF" stroke="#DCDDD2" stroke-width="2"/><circle cx="759" cy="232" r="21" fill="#D69538" /><text x="759" y="240" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle" >2</text><text x="796" y="241" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#173B42" text-anchor="start" >Rock, uplift and fractures</text><rect x="60" y="637" width="620" height="410" rx="22" fill="#FFFFFF" stroke="#DCDDD2" stroke-width="2"/><circle cx="99" cy="676" r="21" fill="#D69538" /><text x="99" y="684" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle" >3</text><text x="136" y="685" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#173B42" text-anchor="start" >Water carves the land</text><rect x="720" y="637" width="620" height="410" rx="22" fill="#FFFFFF" stroke="#DCDDD2" stroke-width="2"/><circle cx="759" cy="676" r="21" fill="#D69538" /><text x="759" y="684" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle" >4</text><text x="796" y="685" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#173B42" text-anchor="start" >Sea surrounds the towers</text><rect x="85" y="268" width="570" height="182" rx="10" fill="#CFE8E7" /><path d="M85 418Q230 402 360 419T655 416L655 450L85 450Z" fill="#DCC7A5"/><rect x="85" y="450" width="570" height="19" rx="0" fill="#CDBA9E" /><rect x="85" y="469" width="570" height="19" rx="0" fill="#DCCAAA" /><rect x="85" y="488" width="570" height="19" rx="0" fill="#C3B397" /><path d="M144 401Q155 377 166 401Z" fill="#F8F1DA" stroke="#A08E72" stroke-width="2"/><path d="M245 409Q256 385 267 409Z" fill="#F8F1DA" stroke="#A08E72" stroke-width="2"/><path d="M379 406Q390 382 401 406Z" fill="#F8F1DA" stroke="#A08E72" stroke-width="2"/><path d="M519 413Q530 389 541 413Z" fill="#F8F1DA" stroke="#A08E72" stroke-width="2"/><line x1="356" y1="310" x2="356" y2="373" stroke="#39756C" stroke-width="3" /><path d="M348 363L356 378L364 363" fill="none" stroke="#39756C" stroke-width="3"/><text x="85" y="528.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#567177" text-anchor="start" >Marine carbonate sediment accumulates.</text><text x="85" y="559.05" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#567177" text-anchor="start" >Burial and cementation create limestone.</text><text x="85" y="585" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#567177" text-anchor="start" >Permian rock; its present shape formed much later.</text><rect x="745" y="268" width="570" height="231" rx="10" fill="#ECF1E8" /><path d="M745 343Q850 283 930 343T1090 343T1315 323L1315 451Q1205 471 1090 451T930 451T745 451Z" fill="#CDBB9F"/><path d="M745 343Q850 283 930 343T1090 343T1315 323L1315 370Q1205 390 1090 370T930 370T745 370Z" fill="#D5C3A7" stroke="#AC9E87" stroke-width="1"/><path d="M745 370Q850 310 930 370T1090 370T1315 350L1315 397Q1205 417 1090 397T930 397T745 397Z" fill="#C5B496" stroke="#AC9E87" stroke-width="1"/><path d="M745 397Q850 337 930 397T1090 397T1315 377L1315 424Q1205 444 1090 424T930 424T745 424Z" fill="#DDCBAE" stroke="#AC9E87" stroke-width="1"/><path d="M745 424Q850 364 930 424T1090 424T1315 404L1315 451Q1205 471 1090 451T930 451T745 451Z" fill="#C7B69B" stroke="#AC9E87" stroke-width="1"/><line x1="1120" y1="294" x2="1040" y2="493" stroke="#5B554B" stroke-width="4" /><line x1="915" y1="313" x2="915" y2="277" stroke="#39756C" stroke-width="3" /><path d="M907 288L915 274L923 288" fill="none" stroke="#39756C" stroke-width="3"/><text x="1152" y="288" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="400" fill="#567177" text-anchor="start" >fracture / fault</text><text x="745" y="528.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#567177" text-anchor="start" >Earth movements raise and break the rock.</text><text x="745" y="559.05" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#567177" text-anchor="start" >Faults and joints create pathways for water.</text><text x="745" y="585" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#567177" text-anchor="start" >These changes occur over long spans of time.</text><rect x="85" y="712" width="570" height="231" rx="10" fill="#E7F0ED" /><line x1="132" y1="733" x2="120" y2="758" stroke="#76ABAE" stroke-width="3" /><line x1="212" y1="733" x2="200" y2="758" stroke="#76ABAE" stroke-width="3" /><line x1="292" y1="733" x2="280" y2="758" stroke="#76ABAE" stroke-width="3" /><line x1="372" y1="733" x2="360" y2="758" stroke="#76ABAE" stroke-width="3" /><line x1="452" y1="733" x2="440" y2="758" stroke="#76ABAE" stroke-width="3" /><line x1="532" y1="733" x2="520" y2="758" stroke="#76ABAE" stroke-width="3" /><line x1="612" y1="733" x2="600" y2="758" stroke="#76ABAE" stroke-width="3" /><path d="M85 927L85 894L132 893L148 799L178 789L201 880L271 887L290 768L327 759L350 884L414 891L440 795L468 785L493 891L558 884L577 816L605 812L625 896L655 900L655 943L85 943Z" fill="#AAB69A" stroke="#6C846D" stroke-width="3"/><path d="M309 784L313 820L300 848L312 885" fill="none" stroke="#5C8F99" stroke-width="4"/><text x="85" y="972.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#567177" text-anchor="start" >Weakly acidic rain dissolves limestone.</text><text x="85" y="1003.05" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#567177" text-anchor="start" >Cracks widen; caves and steep hills develop.</text><text x="85" y="1029" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#567177" text-anchor="start" >Dissolution, collapse and surface erosion work together.</text><rect x="745" y="712" width="570" height="231" rx="10" fill="#E7F0ED" /><path d="M745 944L745 876L785 875L812 762L857 748L882 874L922 886L939 840L967 832L985 885L1038 892L1059 816L1097 808L1112 892L1182 900L1191 838L1178 808L1218 804L1236 838L1219 903L1315 904L1315 944Z" fill="#AAB69A" stroke="#6C846D" stroke-width="3"/><rect x="745" y="891" width="570" height="53" rx="0" fill="#CFE8E7" /><path d="M745 892Q770 885 795 892T845 892T895 892T945 892T995 892T1045 892T1095 892T1145 892T1195 892T1245 892T1315 892" fill="none" stroke="#78B4B6" stroke-width="3"/><text x="745" y="972.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#567177" text-anchor="start" >Sea-level changes flood low-lying ground.</text><text x="745" y="1003.05" font-family="DejaVu Sans, Arial, sans-serif" font-size="23" font-weight="400" fill="#567177" text-anchor="start" >Water, waves and organisms erode rock.</text><text x="745" y="1029" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#567177" text-anchor="start" >A stack is a remnant of rock; it is not a floating island.</text><text x="60" y="1114" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#173B42" text-anchor="start" >Processes overlap and recur. Panels are schematic, not a dated reconstruction of Ko Tapu.</text><text x="60" y="1155" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#567177" text-anchor="start" >Original illustration: Story Atlas • Scientific basis: Thailand Department of Mineral Resources</text></svg>