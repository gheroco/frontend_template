<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100" role="img" aria-labelledby="title desc"><title id="title">Khao Phing Kan and Ko Tapu schematic local map</title><desc id="desc">An explicitly not-to-scale plan shows Khao Phing Kan as western and eastern limestone hills linked by a sandy tombolo. Ko Tapu is a separate rock in the cove to the north. The leaning slab is located at the western hill.</desc><rect x="0" y="0" width="1400" height="1100" rx="0" fill="#F6F4EC" /><text x="65" y="64" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="600" fill="#567177" text-anchor="start" >STORY ATLAS  /  READ THE LANDSCAPE</text><text x="65" y="116" font-family="DejaVu Sans, Arial, sans-serif" font-size="45" font-weight="700" fill="#173B42" text-anchor="start" >Two names, two different places</text><text x="65" y="160" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#567177" text-anchor="start" >Khao Phing Kan is the visitor island; Ko Tapu is the offshore rock.</text><rect x="55" y="197" width="1290" height="760" rx="25" fill="#CFE8E7" /><text x="1275" y="255" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="700" fill="#173B42" text-anchor="middle" >N</text><path d="M1275 270L1263 305L1275 298L1287 305Z" fill="#173B42"/><text x="100" y="253" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="600" fill="#567177" text-anchor="start" >SCHEMATIC PLAN • NOT TO SCALE</text><path d="M485 649Q650 677 815 615L851 753Q653 745 491 800Z" fill="#ECD6A4" stroke="#C9AD74" stroke-width="3"/><path d="M168 576Q122 460 246 426Q335 354 422 440Q529 411 570 536Q628 584 553 661Q609 747 517 823Q412 871 313 813Q186 834 151 727Q113 656 168 576Z" fill="#7D9A7D" stroke="#456C5D" stroke-width="4"/><path d="M216 548Q270 464 389 466Q471 486 493 574Q533 643 467 745Q352 791 248 720Q204 636 216 548Z" fill="#94AB8B"/><path d="M793 467Q899 397 1006 457Q1113 437 1186 543Q1248 655 1166 746Q1157 823 1036 844Q923 883 841 799Q751 755 775 662Q732 574 793 467Z" fill="#7D9A7D" stroke="#456C5D" stroke-width="4"/><path d="M847 516Q948 472 1051 521Q1150 588 1112 714Q1080 790 956 791Q860 760 837 670Q812 585 847 516Z" fill="#94AB8B"/><path d="M398 431L438 472L411 498L369 456Z" fill="#BAC2AE" stroke="#516353" stroke-width="3"/><line x1="410" y1="459" x2="238" y2="331" stroke="#173B42" stroke-width="2" /><text x="110" y="302.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#173B42" text-anchor="start" >Leaning slab</text><text x="110" y="334.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="600" fill="#173B42" text-anchor="start" >at the western hill</text><circle cx="708" cy="350" r="42" fill="#B5B898" stroke="#697B65" stroke-width="3"/><circle cx="708" cy="350" r="19" fill="#8C9A7C" /><line x1="754" y1="348" x2="857" y2="299" stroke="#173B42" stroke-width="2" /><text x="876" y="294" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#173B42" text-anchor="start" >KO TAPU</text><text x="876" y="331.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#567177" text-anchor="start" >Freestanding limestone</text><text x="876" y="363.4" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#567177" text-anchor="start" >sea stack in the northern cove</text><text x="352" y="616.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle" >WESTERN</text><text x="352" y="652.45" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle" >HILL</text><text x="985" y="624.0" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle" >EASTERN</text><text x="985" y="660.45" font-family="DejaVu Sans, Arial, sans-serif" font-size="27" font-weight="700" fill="#FFFFFF" text-anchor="middle" >HILL</text><line x1="650" y1="715" x2="650" y2="834" stroke="#173B42" stroke-width="2" /><text x="650" y="868" font-family="DejaVu Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#173B42" text-anchor="middle" >Tombolo</text><text x="650" y="902" font-family="DejaVu Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#567177" text-anchor="middle" >Sand links the two hills.</text><text x="705" y="550" font-family="DejaVu Sans, Arial, sans-serif" font-size="25" font-weight="600" fill="#5C9293" text-anchor="middle" >Cove</text><text x="65" y="1010" font-family="DejaVu Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#173B42" text-anchor="start" >KHAO PHING KAN = both hills and the connecting sandbar</text><text x="65" y="1052" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" fill="#567177" text-anchor="start" >Original schematic: Story Atlas. Spatial relationships: Thailand Department of Mineral Resources.</text></svg>