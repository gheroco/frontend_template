<body>
<header class="topbar"><a class="brand" href="./"><span class="brand-mark" data-icon="building"></span><span>Yerevan <b>Atlas</b><small data-i18n="Find a home. See the whole picture.">Գտեք տուն։ Տեսեք ամբողջ պատկերը։</small></span></a><nav class="main-nav" data-i18n-label="Navigation"><button data-view="explore" class="nav-link active" data-i18n="Explore">Ուսումնասիրել</button><button data-view="saved" class="nav-link"><span data-i18n="Saved">Պահված</span> <span id="savedCount" class="count">0</span></button><button id="compareTop" class="nav-link"><span data-i18n="Compare">Համեմատել</span> <span id="compareCount" class="count">0</span></button></nav><div class="header-actions"><select id="languageSelect" class="language-select" aria-label="Լեզու / Язык / Language"><option value="hy">ՀԱՅ</option><option value="ru">РУС</option><option value="en">ENG</option></select><button id="coverageButton" class="icon-button" data-i18n-label="About the data" data-icon="info"></button><button id="preferencesButton" class="button dark small"><span data-icon="sliders"></span><span data-i18n="My preferences">Իմ նախընտրությունները</span></button></div></header>
<main class="workspace"><aside class="sidebar" id="sidebar"><div class="sidebar-intro"><div class="eyebrow" data-i18n="YOUR NEXT CHAPTER">ՁԵՐ ՆՈՐ ՍԿԻԶԲԸ</div><h1 data-i18n="A place to call home.">Վայր՝ ձեր տունը դառնալու համար։</h1><p data-i18n="Explore the city. Look closer. Choose confidently.">Ուսումնասիրեք քաղաքը։ Նայեք մանրամասներին։ Ընտրեք վստահ։</p><label class="search-field"><span data-icon="search"></span><input id="searchInput" type="search" autocomplete="off" data-i18n-placeholder="Project, street, developer…" data-i18n-label="Search projects"/><kbd>/</kbd></label><div class="quick-filters"><select id="districtFilter" data-i18n-label="District"></select><select id="statusFilter" data-i18n-label="Construction stage"><option value="" data-i18n="All stages"></option><option value="under_construction" data-i18n="Under construction"></option><option value="completed" data-i18n="Reported complete"></option><option value="unknown" data-i18n="Status unverified"></option></select></div><div class="preference-summary"><span data-icon="sliders"></span><span id="preferenceSummary"></span><button id="editPreferences" data-i18n="Edit"></button></div><div class="chip-row"><button id="matchToggle" class="chip" aria-pressed="false" data-i18n="Budget matches"></button><button id="preferredToggle" class="chip" aria-pressed="false" data-i18n="Ajapnyak + Arabkir"></button><button id="offersToggle" class="chip" aria-pressed="false" data-i18n="Apartment offers"></button></div></div><div id="insightStrip" class="insight-strip"></div><div class="results-toolbar"><span id="resultCount" role="status" data-i18n="Loading projects…"></span><select id="sortSelect" data-i18n-label="Sort results"><option value="match" data-i18n="Best fit"></option><option value="price" data-i18n="Lowest starting price"></option><option value="date" data-i18n="Target handover"></option><option value="distance" data-i18n="Distance to my place"></option><option value="name" data-i18n="Name"></option></select></div><div id="resultsList" class="results-list"></div><footer class="sidebar-footer"><span id="checkedLabel"></span><button id="exportButton"><span data-i18n="Export CSV"></span><span data-icon="download"></span></button></footer></aside>
<section class="map-panel"><div id="map"></div><div class="map-top"><div class="map-heading"><span data-icon="pin"></span><div><strong data-i18n="Yerevan, Armenia"></strong><small id="mapSubheading"></small></div></div><div class="map-view-switch"><button id="view3d" class="active" aria-pressed="true">3D</button><button id="view2d" aria-pressed="false">2D</button><button id="layersButton" data-i18n-label="Map layers" data-icon="layers"></button></div></div><div id="mapNotice" class="map-notice" role="status" hidden></div><div id="mapLayers" class="map-layer-panel" hidden><label class="footprint-filter"><input id="footprintsOnlyToggle" type="checkbox"/><span data-i18n="Only projects with mapped footprints"></span></label><label><input id="cityBuildingsToggle" type="checkbox" checked/><span data-i18n="City buildings"></span></label><label><input id="projectModelsToggle" type="checkbox" checked/><span data-i18n="Project models"></span></label><label><input id="labelsToggle" type="checkbox" checked/><span data-i18n="Project names"></span></label><label><input id="radiusToggle" type="checkbox" checked/><span data-i18n="1 km reference radius"></span></label></div><div class="map-tools"><button id="fitMap" class="icon-button" data-i18n-label="Show all results" data-icon="expand"></button><button id="referenceButton" class="icon-button" data-i18n-label="Choose a reference location" data-icon="pin"></button><button id="fullscreenButton" class="icon-button" data-i18n-label="Fullscreen" data-icon="expand"></button><button id="resetNorth" class="icon-button" data-i18n-label="Reset north">N</button><button id="zoomIn" class="icon-button" data-i18n-label="Zoom in">+</button><button id="zoomOut" class="icon-button" data-i18n-label="Zoom out">−</button></div><div class="map-count"><strong id="mapProjectCount">—</strong><span data-i18n="mapped records"></span><small id="footprintCount"></small></div><div id="referenceBadge" class="reference-badge" hidden></div><div class="map-bottom"><div class="map-legend"><span><i class="legend-dot matched"></i><span data-i18n="Budget fit"></span></span><span><i class="legend-dot other"></i><span data-i18n="Other projects"></span></span><button id="geometryButton"><span data-icon="info"></span><span data-i18n="Model accuracy"></span></button></div><div class="map-hint" data-i18n="Drag to explore · Right-drag to tilt"></div></div><button id="mobileResults" class="button dark mobile-results"><span data-icon="list"></span><span data-i18n="View projects"></span></button></section><aside id="detailPanel" class="detail-panel" hidden></aside></main>
<div id="compareTray" class="compare-tray" hidden><div><strong id="trayTitle"></strong><span id="trayNames"></span></div><button id="openCompare" class="button dark small" data-i18n="Compare side by side"></button><button id="clearCompare" class="icon-button" data-i18n-label="Clear comparison">×</button></div>
<dialog id="preferencesDialog" class="modal preferences-modal"><div class="modal-header"><div><div class="eyebrow" data-i18n="YOUR NEXT HOME"></div><h2 data-i18n="What matters to you?"></h2></div><button class="close-dialog icon-button" data-i18n-label="Close">×</button></div><form id="preferencesForm"><p data-i18n="Set your purchase range. Optional costs are shown separately in your total-cost scenario."></p><label class="field-title" data-i18n="Purchase budget · million AMD"></label><div class="input-pair"><label><span data-i18n="From"></span><input name="budgetMin" type="number" min="0" step="0.5" required/></label><span>—</span><label><span data-i18n="To"></span><input name="budgetMax" type="number" min="1" step="0.5" required/></label></div><label class="field-title" data-i18n="Apartment size · m²"></label><div class="input-pair"><label><span data-i18n="From"></span><input name="areaMin" type="number" min="15" max="1500" required/></label><span>—</span><label><span data-i18n="To"></span><input name="areaMax" type="number" min="15" max="1500" required/></label></div><details class="cost-settings"><summary data-i18n="Total-cost planning"></summary><p data-i18n="Your own assumptions; these are not seller quotes."></p><label><span data-i18n="Renovation · AMD / m²"></span><input name="renovation" type="number" min="0" max="5000000" step="1000"/></label><label><span data-i18n="Parking · million AMD"></span><input name="parking" type="number" min="0" max="500" step="0.1"/></label><label><span data-i18n="Other fees · % of purchase"></span><input name="feePercent" type="number" min="0" max="100" step="0.1"/></label></details><label class="field-title" data-i18n="Planning exchange rate · AMD per USD"></label><input name="fx" type="number" min="1" step="0.01" required/><p class="field-help" data-i18n="Reference: CBA, 12 Oct 2026, 362.21 AMD/USD. Replace with your bank or seller’s rate."></p><label class="check-row"><input name="nearby" type="checkbox"/><span data-i18n="Include developments outside Yerevan"></span></label><label class="check-row"><input name="includeUnknown" type="checkbox"/><span data-i18n="Keep missing-price projects in budget matches"></span></label><p id="preferencesError" role="alert" class="error-text"></p><button type="submit" class="button dark full" data-i18n="Apply preferences"></button></form></dialog>
<dialog id="infoDialog" class="modal"><div class="modal-header"><h2 id="infoTitle"></h2><button class="close-dialog icon-button" data-i18n-label="Close">×</button></div><div id="infoContent"></div></dialog><dialog id="compareDialog" class="modal compare-modal"><div class="modal-header"><div><div class="eyebrow" data-i18n="MAKE THE DETAILS COUNT"></div><h2 data-i18n="Compare your possibilities."></h2></div><button class="close-dialog icon-button" data-i18n-label="Close">×</button></div><div id="compareContent"></div></dialog><dialog id="studioDialog" class="studio-dialog"></dialog><div id="toast" class="toast" role="status" hidden></div><noscript>Այս քարտեզի համար անհրաժեշտ է JavaScript։ Для карты необходим JavaScript. This atlas requires JavaScript.</noscript><script type="module" src="/src/main.js"></script></body></html>
