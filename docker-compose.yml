name: atlas-platform
services:
  registry:
    build:
      context: .
      dockerfile: apps/extension-registry/Dockerfile
    environment:
      REGISTRY_SOURCE: filesystem
      CATALOG_DIR: /catalog
      REGISTRY_API_TOKEN: ${REGISTRY_API_TOKEN:?Run npm run setup first}
      SERVICE_VERSION: 1.0.0
    volumes:
      - ./catalog/docker:/catalog:ro
    ports: ["4100:4100"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4100/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    environment:
      AUTH_MODE: dev
      DEV_JWT_SECRET: ${DEV_JWT_SECRET:?Run npm run setup first}
      OIDC_AUDIENCE: portal-api
      PORTAL_PUBLIC_URL: http://localhost:4000
      SERVICE_VERSION: 1.0.0
    ports: ["4201:4201"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4201/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  audit:
    build:
      context: .
      dockerfile: services/audit/Dockerfile
    environment:
      AUTH_MODE: dev
      DEV_JWT_SECRET: ${DEV_JWT_SECRET:?Run npm run setup first}
      OIDC_AUDIENCE: portal-api
      PORTAL_PUBLIC_URL: http://localhost:4000
      SERVICE_VERSION: 1.0.0
    ports: ["4202:4202"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4202/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  postgres:
    image: postgres:17.6-alpine3.22
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas-dev-only
    volumes: [github-webhooks-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas -d atlas"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt: ["no-new-privileges:true"]

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: atlas
      RABBITMQ_DEFAULT_PASS: atlas-dev-only
    volumes:
      - github-webhooks-rabbitmq:/var/lib/rabbitmq
      - ./services/github-webhooks/deploy/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt: ["no-new-privileges:true"]

  github-webhooks:
    build:
      context: .
      dockerfile: services/github-webhooks/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    environment:
      AUTH_MODE: dev
      DEV_JWT_SECRET: ${DEV_JWT_SECRET:?Run npm run setup first}
      OIDC_AUDIENCE: portal-api
      PORTAL_PUBLIC_URL: http://localhost:4000
      SERVICE_VERSION: 1.0.0
      WEBHOOK_RUNTIME: external
      RUN_MIGRATIONS: "true"
      DATABASE_URL: postgresql://atlas:atlas-dev-only@postgres:5432/atlas
      AMQP_URL: amqp://atlas:atlas-dev-only@rabbitmq:5672
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Run npm run setup first}
    ports: ["4203:4203"]
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:4203/health/api-ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 10s
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  github-webhooks-worker:
    build:
      context: .
      dockerfile: services/github-webhooks/Dockerfile
    command: ["services/github-webhooks/dist/server/worker.js"]
    depends_on:
      github-webhooks: { condition: service_healthy }
    environment:
      SERVICE_VERSION: 1.0.0
      WEBHOOK_RUNTIME: external
      DATABASE_URL: postgresql://atlas:atlas-dev-only@postgres:5432/atlas
      AMQP_URL: amqp://atlas:atlas-dev-only@rabbitmq:5672
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:?Run npm run setup first}
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

  portal:
    build:
      context: .
      dockerfile: apps/portal-shell/Dockerfile
    depends_on:
      registry: { condition: service_healthy }
      inventory: { condition: service_healthy }
      audit: { condition: service_healthy }
      github-webhooks: { condition: service_healthy }
    environment:
      AUTH_MODE: dev
      COOKIE_SECURE: "false"
      SESSION_KEY: ${SESSION_KEY:?Run npm run setup first}
      DEV_JWT_SECRET: ${DEV_JWT_SECRET:?Run npm run setup first}
      REGISTRY_API_TOKEN: ${REGISTRY_API_TOKEN:?Run npm run setup first}
      REGISTRY_URL: http://registry:4100
      MICROFRONTEND_ORIGINS: http://localhost:4201,http://localhost:4202,http://localhost:4203
      PORTAL_PUBLIC_URL: http://localhost:4000
      OIDC_AUDIENCE: portal-api
      SERVICE_VERSION: 1.0.0
    ports: ["4000:4000"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health/ready"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

networks:
  default:
    name: atlas-platform

volumes:
  github-webhooks-postgres:
  github-webhooks-rabbitmq:
